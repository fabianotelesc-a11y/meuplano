/* Meu plano · Acompanhamento Individualizado — identidade Fabiano Teles: off-white, azul profundo, preto e cinzas, Montserrat */
/* (os nomes antigos ficaram: papel = fundo, linho = linhas, ouro = rótulos em cinza) */
:root { --navy:#091C2D; --navy2:#1F4566; --sky:#AFC1D6; --papel:#F7F7F7; --linho:#E9E9E9; --linho2:#F0F0F0; --ink:#141414; --muted:#5C5C5C; --ouro:#757575; --white:#fff; --ok:#2F6B4F; --bad:#9E3B32;
  --font: Montserrat, "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--papel); color: var(--ink); font: 15px/1.5 var(--font); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--navy); }
.wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }
.loading { color: var(--muted); padding: 80px 20px; text-align: center; }
.kick { margin: 0; font-size: 10px; letter-spacing: .24em; font-weight: 600; color: var(--ouro); text-transform: uppercase; }
.kick.claro { color: var(--sky); }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
.navy { color: var(--navy); }
.flex1 { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t-serif { font-weight: 300; font-size: 24px; letter-spacing: .02em; line-height: 1.15; color: var(--navy); }
.grande { margin: 0; font-size: 17px; font-weight: 600; color: var(--navy); }

/* entrar: tela de acesso do Design System (ft.css) */
/* estrutura */
.tela { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(104px + env(safe-area-inset-bottom, 0px)); }
.cab { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }

.marca div { display: flex; flex-direction: column; gap: 1px; } .marca b { font-size: 13px; color: var(--navy); font-weight: 600; letter-spacing: .06em; }
.selo-p { width: 42px; height: 42px; border-radius: 50%; }
.cab h1 { margin: 0; font-weight: 300; font-size: 34px; letter-spacing: .02em; line-height: 1.1; color: var(--navy); }
.cab .sub { margin: 0; font-size: 13px; color: var(--muted); }
.voltar { align-self: flex-start; background: none; border: none; padding: 0 0 8px; font-weight: 600; color: var(--navy); cursor: pointer; }
.cards { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--white); border: 1px solid var(--linho); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
button.card { cursor: pointer; }
.card.destaque { border-color: var(--navy); }
.linha { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.btn { display: block; width: 100%; text-align: center; text-decoration: none; background: var(--navy); color: var(--white); border: none; border-radius: 999px; padding: 15px; font-weight: 700; font-size: 15px; cursor: pointer; }
.btn.sec { background: transparent; color: var(--navy); border: 1px solid var(--navy); }
.btn:disabled { opacity: .55; }
.pill { align-self: flex-start; background: var(--white); color: var(--navy); font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 999px; text-decoration: none; }
.pill.borda { border: 1px solid var(--navy); background: transparent; }
.mini { background: var(--white); border: 1px solid #D7D7D7; border-radius: 999px; padding: 6px 11px; font-size: 12px; font-weight: 700; color: var(--navy); cursor: pointer; white-space: nowrap; }
.link { background: none; border: none; color: var(--navy); font-weight: 600; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 6px; }

/* início */

.agora.com-foto .kick { position: absolute; top: 16px; left: 16px; background: var(--navy); padding: 6px 10px; border-radius: 999px; } .agora.com-foto { position: relative; }

.tipo-hoje { border-left: 4px solid var(--cor); } .tipo-n { font-size: 22px; font-weight: 400; color: var(--navy); display: block; margin-top: 2px; }

.bola.ok { background: var(--navy); } .bola.parcial { background: var(--sky); } .bola.fut { background: transparent; border: 1px dashed #B8B8B8; } .bola.hoje { outline: 2px solid var(--navy); outline-offset: 2px; }

.data-q small { font-size: 10px; font-weight: 700; color: var(--ouro); } .data-q b { font-size: 24px; font-weight: 300; color: var(--navy); line-height: 1; }
/* Receitas (Fase 4) */

.rec-m { display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--linho); border-radius: 14px; padding: 8px; text-align: left; color: var(--navy); cursor: pointer; }
.rec-m b { display: block; font-size: 14px; } .rec-m small { display: block; font-size: 12px; color: var(--muted); }
.rec-troca { font-style: normal; font-size: 11px; font-weight: 700; background: #F2EDE0; color: var(--navy); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }

.rec-foto-c { display: flex; width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; background: var(--linho) center / cover no-repeat; align-items: center; justify-content: center; color: var(--muted); }

.rec-c b { font-size: 14px; line-height: 1.25; } .rec-c small { font-size: 12px; color: var(--muted); } .rec-c .rec-onde { color: var(--navy); }
.chips-f { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; -webkit-overflow-scrolling: touch; scrollbar-width: none; } .chips-f::-webkit-scrollbar { display: none; }
.chip-f { flex: none; background: var(--white); border: 1px solid #D7D7D7; border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer; white-space: nowrap; }
.chip-f.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.rec-atalho { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; cursor: pointer; color: var(--navy); }
.au-atalho { display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; cursor: pointer; color: var(--navy); }
.au-prog { display: flex; flex-direction: column; gap: 8px; } .au-tema { display: flex; flex-direction: column; gap: 4px; }
.au-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--linho2); padding: 10px 0; cursor: pointer; color: inherit; font: inherit; }
.au-tema .kick + .au-item { border-top: 0; } .au-item b { display: block; color: var(--navy); font-size: 15px; } .au-item small { color: #5E6875; font-size: 13px; }
.au-item.fechada { opacity: .55; cursor: default; }
.au-c { flex: none; width: 96px; height: 54px; border-radius: 8px; background: #E9ECEF center / cover no-repeat; display: flex; align-items: center; justify-content: center; color: #8A96A3; }
.au-ok { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--ok, #1D6B3A); display: flex; align-items: center; justify-content: center; }
.au-video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; margin: 4px 0 10px; } .au-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.voltar { align-self: flex-start; }
.rec-meta { font-size: 13px; color: var(--muted); margin: 0; }
.rec-ok, .rec-dif { margin: 0; padding: 12px 14px; border-radius: 14px; font-size: 13px; line-height: 1.45; } .rec-ok { background: #EEF4F0; color: #1F4D37; } .rec-dif { background: #F8F2E6; color: #6B4A12; }
.itens li.troca .n small { color: #6B4A12; }
.folha-c .itens { padding: 0; } .folha-c .itens .q { width: 38%; }
.rec-livres { margin: 0; font-size: 14px; } .rec-plano { margin: 4px 0 10px; padding: 12px 14px; border-radius: 12px; background: #F2F4F6; display: flex; flex-direction: column; gap: 8px; } .rec-plano .kick { margin: 0; } .rec-prep summary { cursor: pointer; font-weight: 700; color: var(--navy); font-size: 14px; margin-bottom: 6px; } .rec-passos { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.45; }
.atalhos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.avisos-linha { text-align: center; font-size: 13px; margin: 2px 0 10px; } .avisos-linha .mini { background: none; border: none; color: var(--navy); text-decoration: underline; cursor: pointer; font-size: 13px; padding: 0; }

/* meu dia */
.progresso { height: 6px; border-radius: 3px; background: var(--linho); margin: -6px 0 18px; overflow: hidden; } .progresso i { display: block; height: 100%; background: var(--navy); border-radius: 3px; }
.feita { flex-direction: row; align-items: center; gap: 14px; padding: 14px 18px; } .feita small { font-size: 12px; color: var(--muted); } .feita b { color: var(--navy); font-weight: 600; }
.ok-b { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); display: flex; align-items: center; justify-content: center; flex: none; }
.fechada { flex-direction: row; align-items: center; gap: 12px; } .fechada small { font-size: 12px; color: var(--muted); } .seta { color: var(--navy); font-size: 22px; }
.refeicao { padding: 0; overflow: hidden; gap: 0; } .refeicao.atual { border: 2px solid var(--navy); }
.foto { height: 220px; background: var(--linho) center 60% / cover no-repeat; }
.mini-foto { width: 64px; height: 64px; border-radius: 14px; flex: none; background: var(--linho) center / cover no-repeat; }
.foto-sec { height: 170px; border-radius: 16px; margin-bottom: 14px; background: var(--linho) center / cover no-repeat; }
.ref-h { padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 6px; position: relative; width: 100%; text-align: left; background: none; border: 0; font: inherit; color: inherit; cursor: pointer; } .ref-h .seta-f { position: absolute; right: 20px; top: 20px; color: var(--muted); font-size: 18px; } .ref-h .tag { align-self: flex-start; } .ref-h small { font-size: 12px; color: var(--muted); } .ref-h h2 { margin: 0; font-size: 28px; }
.tag { align-self: flex-start; background: var(--navy); color: var(--white); font-size: 10px; font-weight: 700; letter-spacing: .18em; padding: 6px 10px; border-radius: 999px; }

.itens { list-style: none; margin: 0; padding: 6px 20px 0; }

.itens li:last-child { border-bottom: none; } .itens li.sub { padding-left: 12px; }

.refeicao > .btn { margin: 16px 20px 20px; width: auto; } .refeicao > .variar, .refeicao > .rec-plano { margin-left: 20px; margin-right: 20px; } .refeicao > .fiz-2 { margin: 12px 20px 20px; }

/* guia */

.indice li.grupo-g { border: none; padding: 22px 4px 4px; font-size: 10px; letter-spacing: .24em; font-weight: 600; color: var(--ouro); text-transform: uppercase; } .indice li.grupo-g:first-child { padding-top: 4px; }
